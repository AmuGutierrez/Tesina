<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Ficha de Inscripción</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="contenedor-editar">
    <h1>Editar Ficha de Inscripción</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

 <form method="POST" action="{{ url_for('editar_inscripcion', id=alumno.IDAlum) }}">
      <label>Nombre:</label>
      <input type="text" name="nombre" value="{{ alumno.nombre }}" required>

      <label>Apellido:</label>
      <input type="text" name="apellido" value="{{ alumno.apellido }}" required>

      <label>Edad:</label>
      <input type="number" name="edad" value="{{ alumno.edad }}" min="0">

      <label>DNI:</label>
      <input type="text" name="dni" value="{{ alumno.dni }}" required>

      <label>Domicilio:</label>
      <input type="text" name="domicilio" value="{{ alumno.domicilio }}">

      <label>Secundario cursado:</label>
      <input type="text" name="secundario_cursado" value="{{ alumno.secundario_cursado }}">

      <label>Repitente (si/no o año):</label>
      <input type="text" name="repitente" value="{{ alumno.repitente }}">

      <label>Año cursado:</label>
      <input type="text" name="anio_cursado" value="{{ alumno.anio_cursado }}">

      <div class="acciones">
        <button type="submit">Guardar cambios</button>
        <a href="{{ url_for('opciones') }}" class="btn-cancel">Volver</a>
      </div>
    </form>
  </div>
</body>
