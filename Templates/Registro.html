<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro - PROA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-body">
  <div class="login-contenedor">
    <h1>Crear cuenta de Tutor</h1>
    <h2>Escuela PRoA</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form action="{{ url_for('registro') }}" method="POST">
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="apellido">Apellido:</label>
      <input type="text" id="apellido" name="apellido" required>

      <label for="dni">DNI:</label>
      <input type="number" id="dni" name="dni" required>

      <label for="telefono">Teléfono:</label>
      <input type="text" id="telefono" name="telefono" placeholder="351XXXXXXX" required>

      <label for="domicilio">Domicilio:</label>
      <input type="text" id="domicilio" name="domicilio">

      <label for="mail">Correo electrónico:</label>
      <input type="email" id="mail" name="mail" required>

      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" minlength="6" required>

      <button type="submit">Registrarme</button>
    </form>
    <p>¿Ya tenés cuenta? <a href="{{ url_for('login') }}">Iniciar sesión</a></p>
  </div>
</body>
</html>
